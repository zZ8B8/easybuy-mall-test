{% extends "base.html" %}
{% block title %}我的订单 · 易淘商城{% endblock %}

{% block content %}
<h1 class="page-title">我的订单</h1>
<p class="page-sub">数据表：<code>easybuy_mall.orders</code> + <code>order_items</code></p>

<div id="alert" class="alert"></div>
<div id="body"><div class="empty">加载中…</div></div>
{% endblock %}

{% block script %}
<script>
async function load() {
  const box = document.getElementById("body");

  if (!API.token) {
    box.innerHTML = '<div class="empty"><div class="big">🔒</div>' +
      '请先登录才能查看订单<p style="margin-top:12px">' +
      '<a class="btn primary" href="/login">去登录</a></p></div>';
    return;
  }

  const r = await API.get("/api/orders");
  if (!r.ok) {
    box.innerHTML = '<div class="empty"><div class="big">×</div>' +
                    esc(r.message || r.code) + "</div>";
    return;
  }

  const orders = r.data.items;
  if (!orders.length) {
    box.innerHTML = '<div class="empty"><div class="big">📄</div>' +
      '还没有订单<p style="margin-top:12px"><a class="btn primary" href="/">去逛逛</a></p></div>';
    return;
  }

  const rows = orders.map(o => `
    <tr>
      <td><b>#${o.id}</b></td>
      <td class="num">${money(o.amount)}</td>
      <td class="num" style="color:${Number(o.discount_amount) > 0 ? "#16a34a" : "#9ca3af"}">
        ${Number(o.discount_amount) > 0 ? "-" + money(o.discount_amount) : "—"}
      </td>
      <td>${statusBadge(o.status)}</td>
      <td>${esc(o.pay_type || "—")}</td>
      <td style="color:#6b7280;font-size:12.5px">${esc(o.created_at)}</td>
      <td style="color:#6b7280;font-size:12.5px">${esc(o.paid_at || "—")}</td>
      <td style="white-space:nowrap">
        <button class="sm" onclick="detail(${o.id})">详情</button>
        ${o.status === "PENDING"
          ? `<button class="sm primary" onclick="pay(${o.id})">支付</button>`
          : ""}
        <button class="sm" onclick="cancel(${o.id})">取消</button>
      </td>
    </tr>`).join("");

  box.innerHTML = `
    <table>
      <thead><tr>
        <th style="width:70px">订单号</th><th style="width:100px">实付</th>
        <th style="width:100px">优惠</th>
        <th style="width:90px">状态</th><th style="width:90px">支付方式</th>
        <th>下单时间</th><th>支付时间</th><th style="width:190px">操作</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div id="detail-box" style="margin-top:16px"></div>`;

  if (window.__lastOrder) detail(window.__lastOrder);
}

async function detail(id) {
  const r = await API.get("/api/orders/" + id);
  const box = document.getElementById("detail-box");
  if (!r.ok) {
    box.innerHTML = '<div class="card" style="color:#dc2626">' +
                    esc(r.message || r.code) + "</div>";
    return;
  }
  const o = r.data;
  const items = o.items.map(it => `
    <tr>
      <td>${esc(it.product_name)}</td>
      <td class="num">${money(it.price)}</td>
      <td class="num">${it.quantity}</td>
      <td class="num">${money(Number(it.price) * Number(it.quantity))}</td>
    </tr>`).join("");

  box.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <b>订单 #${o.id} 明细</b>
        <span>归属用户 ID：<code>${o.user_id}</code> ${statusBadge(o.status)}</span>
      </div>
      <table>
        <thead><tr><th>商品</th><th style="width:110px">单价</th>
          <th style="width:80px">数量</th><th style="width:110px">小计</th></tr></thead>
        <tbody>${items}</tbody>
      </table>
      <div style="text-align:right;margin-top:12px;line-height:2">
        <div>商品小计 <span class="num">${money(o.total_amount)}</span></div>
        ${Number(o.discount_amount) > 0
          ? `<div style="color:#16a34a">优惠券抵扣 <span class="num">-${money(o.discount_amount)}</span>
             <span style="color:#9ca3af;font-size:12.5px">（${esc(o.coupon_name || "优惠券")}）</span></div>`
          : ""}
        <div>实付 <span class="price" style="font-size:20px">${money(o.amount)}</span></div>
      </div>
    </div>`;
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}

async function pay(id) {
  const r = await API.post("/api/orders/" + id + "/pay", { payType: "ALIPAY" });
  if (r.ok) { showAlert("alert", "ok", "支付成功"); load(); }
  else showAlert("alert", "err", "支付失败：" + (r.message || r.code));
}

async function cancel(id) {
  const r = await API.post("/api/orders/" + id + "/cancel");
  if (r.ok) { showAlert("alert", "ok", "已取消，库存已回滚"); load(); }
  else showAlert("alert", "err", "取消失败：" + (r.message || r.code));
}

load();
</script>
{% endblock %}
